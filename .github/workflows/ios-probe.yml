name: iPhone toolchain attempt 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check project
        run: python3 tools/validate_project.py

      - name: Install recent upstream LLVM
        run: |
          brew install llvm
          echo "LEKAK_POINTER_CC=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"

      - name: Compile for iPhone
        run: python3 tools/build_probe.py

      - name: Validate ARM64 application
        run: python3 tools/validate_project.py --built

      - name: Save compiler results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compiler-results
          path: |
            build/compiler-check.json
            build/build-log.txt
            build/ptr32-ios.ll
          if-no-files-found: ignore
          retention-days: 7

      - name: Save unsigned diagnostic IPA
        uses: actions/upload-artifact@v4
        with:
          name: Lekak-iPhone-Diagnostic
          path: build/Lekak_iPhone_Diagnostic.ipa
          if-no-files-found: error
          retention-days: 7
